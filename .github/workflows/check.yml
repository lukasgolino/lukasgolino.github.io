# Check the site on every push to master and every PR: local links resolve, and the Jekyll build succeeds.
name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 tools/check_site.py
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
