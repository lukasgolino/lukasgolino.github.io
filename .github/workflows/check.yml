# Check the site: local links resolve, and the Jekyll build succeeds.
name: check

# Cheap, so it runs on every push (Run workflow re-runs it by hand).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 tools/check_site.py
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
