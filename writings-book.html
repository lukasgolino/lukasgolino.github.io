<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --panel: rgba(255, 255, 255, 0.84);
            --ink: #0f1720;
            --muted: #516273;
            --line: rgba(15, 23, 32, 0.1);
            --accent: #1f7a8c;
            --shadow: 0 16px 50px rgba(10, 25, 41, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Manrope", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 10% 12%, rgba(31, 122, 140, 0.2), transparent 34%),
                radial-gradient(circle at 86% 18%, rgba(191, 219, 247, 0.6), transparent 30%),
                linear-gradient(160deg, #edf2f7 0%, #f8fafc 45%, #e9f1f8 100%);
            padding: 2rem 1rem;
        }

        main {
            width: min(1100px, 100%);
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 22px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        .hero,
        .viewer-wrap {
            padding: 2.2rem clamp(1.1rem, 2.5vw, 2.4rem);
        }

        .hero {
            border-bottom: 1px solid var(--line);
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 3vw, 2.9rem);
            letter-spacing: -0.03em;
        }

        p {
            color: var(--muted);
            line-height: 1.7;
        }

        .chapter {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #ffffff;
            padding: clamp(1.2rem, 2vw, 2rem);
            margin-bottom: 1.25rem;
        }

        .chapter-body {
            margin: 0;
            white-space: pre-wrap;
            color: var(--ink);
            line-height: 1.9;
            font-size: clamp(1rem, 1.5vw, 1.1rem);
            text-align: left;
        }

        .chapter-body p,
        .chapter-body em,
        .chapter-body strong,
        .chapter-body b,
        .chapter-body i {
            margin: 0 0 1.2rem;
            text-align: left;
        }

        .chapter-body.empty {
            color: var(--muted);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }

        .actions a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
        }

        .actions a:hover,
        .actions a:focus-visible {
            text-decoration: underline;
            outline: none;
        }
    </style>
</head>

<body>
    <main>
        <section class="hero">
            <h1 id="book-title">Book</h1>
            <p id="book-intro">Loading chapter preview…</p>
        </section>

        <section class="viewer-wrap">
            <article class="chapter">
                <div id="chapter-content" class="chapter-body">Loading chapter…</div>
            </article>

            <div class="actions">
                <a id="request-email" href="#">Email me to read the rest</a>
                <a href="/writings.html">Back to Writings</a>
                <a href="/">Back to Home</a>
            </div>
        </section>
    </main>

    <script>
        function renderMarkdown(markdown) {
            const escaped = markdown
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            const withStrong = escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
            const withEmphasis = withStrong.replace(/(^|[^*])\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, "$1<em>$2</em>");
            const blocks = withEmphasis
                .split(/\n\s*\n+/)
                .map((block) => block.trim())
                .filter(Boolean)
                .map((block) => `<p>${block.replace(/\n/g, "<br>")}</p>`)
                .join("");

            return blocks || "<p>Chapter preview is not available yet.</p>";
        }

        function extractRenderedMarkdownHtml(rawText) {
            if (!rawText || typeof rawText !== "string") return "";

            const trimmed = rawText.trim();
            if (!trimmed) return "";
            if (!trimmed.includes("<html") && !trimmed.includes("window.__MDLS__") && !trimmed.includes("<main id=\"content\">")) {
                return "";
            }

            try {
                const doc = new DOMParser().parseFromString(trimmed, "text/html");
                const main = doc.querySelector("#content") || doc.querySelector("main");
                if (main) return main.innerHTML.trim();
                return doc.body?.innerHTML?.trim() || "";
            } catch (error) {
                return "";
            }
        }

        async function initBook() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get("book") || "ymlib";

            try {
                const metadataResponse = await fetch(`/writings/${slug}/metadata.json`);
                if (!metadataResponse.ok) throw new Error("Book metadata not found");
                const metadata = await metadataResponse.json();

                const book = {
                    slug,
                    title: metadata.title || slug,
                    folder: `/writings/${slug}`,
                    preview: metadata.preview || "preview.md",
                    email: metadata.email || "lukas.golino@hotmail.co.uk",
                    subject: metadata.subject || `Request full PDF of ${metadata.title || slug}`,
                    emailBody: metadata.emailBody || `Hello Lukas,\n\nI would like to request the full PDF of \"${metadata.title || slug}.\"\n\nThank you.`
                };

                document.title = `${book.title} — Chapter Preview`;
                document.getElementById("book-title").textContent = book.title;
                document.getElementById("book-intro").textContent = `Previewing the opening chapter of ${book.title}.`;

                const emailLink = document.getElementById("request-email");
                emailLink.href = `mailto:${book.email}?subject=${encodeURIComponent(book.subject)}&body=${encodeURIComponent(book.emailBody)}`;

                const chapterPath = `${book.folder}/${book.preview}`;
                const chapterContent = document.getElementById("chapter-content");

                const chapterResponse = await fetch(chapterPath);
                if (!chapterResponse.ok) throw new Error("Chapter preview not found");

                const text = await chapterResponse.text();
                const renderedHtml = extractRenderedMarkdownHtml(text);
                chapterContent.innerHTML = renderedHtml || renderMarkdown(text.trim());
            } catch (error) {
                const chapterContent = document.getElementById("chapter-content");
                chapterContent.innerHTML = "<p class=\"empty\">The first chapter for this book is not available yet. Please check back soon.</p>";
                chapterContent.classList.add("empty");
            }
        }

        initBook();
    </script>
</body>

</html>
